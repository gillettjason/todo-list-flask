{% extends "base.html" %}

{% block title %}Notable Home{% endblock %}

{% block content %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="{{ url_for('tasks_bp.home') }}">Notable</a>

<button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbarNav"
    aria-controls="navbarNav"
    aria-expanded="false"
    aria-label="Toggle navigation"
>
    <span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
        <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('tasks_bp.home') }}">
                Home
            </a>
        </li>
    </ul>
</div>

</nav>

<div id="container-content" class="container">
    <div id="task-content">
    <div class="task-header">
        <h1>My Tasks</h1>
        <p class="text-muted">Keep track of what you need to get done.</p>
    </div>

    <div class="card task-card">
        <div class="card-body">

            <form>
                <div id="task-input-group" class="input-group">
                    <input
                        id="task-input"
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                    >

                    <button
                        id="getTaskTitleInput"
                        class="btn btn-primary"
                        type="submit"
                    >
                        Add Task
                    </button>
                </div>
            </form>

            <div id="task-error" class="text-danger"></div>

            <ul id="task-list" class="list-unstyled">
            </ul>

        </div>
    </div>
</div>
</div>

{% endblock %}
